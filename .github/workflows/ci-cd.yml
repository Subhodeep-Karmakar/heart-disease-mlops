name: MLOps Continuous Integration & Training Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-test-train:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out code from GitHub
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Python environment
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    # 3. Install dependencies and linter
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8

    # 4. Linting Step (check for Python syntax errors and undefined names)
    - name: Lint Code with Flake8
      run: |
        # Stop build if there are Python syntax errors or undefined names
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all other formatting warnings as non-fatal
        flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 5. Automated Unit Tests Step
    - name: Run Unit Tests with Pytest
      run: |
        python -m pytest -v

    # 6. Automated Model Training Step
    - name: Train Models & Track Experiments
      run: |
        python src/train.py

    # 7. Upload Workflow Artifacts (Model + Evaluation Plots)
    - name: Archive Model and Evaluation Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trained-model-and-evaluation-plots
        path: |
          models/best_model.pkl
          docs/images/cm_*.png
          docs/images/roc_*.png
        retention-days: 7